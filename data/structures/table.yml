comment: >-
  Makes a Markdown table responsive with horizontal scrolling on smaller screens.
  Sorting, paging, searching, and filtering require the simple-datatables module.
icon: table_chart
arguments:
  page:
    group: partial
  input:
    type:
      - string
      - template.HTML
    optional: false
    comment: Table input in markdown format.
    group: partial
  breakpoint:
    optional: true
    position: 0
    preview: true
  class:
  sortable:
    release: v0.24.13
  paginate:
    release: v1.23.0
  pagination:
    release: v1.23.0
  pagination-select:
    release: v1.23.0
  searchable:
    release: v0.24.13
  filter:
  filter-col:
  filter-responsive:
    type: bool
    default: false
    optional: true
    comment: >-
      Whether the filter button group collapses into a dropdown below the site's
      main breakpoint, for groups too wide to fit a narrow viewport. Defaults to
      false, so the button group renders at every width. Requires `filter`, and
      has no effect when the main breakpoint is `xs`.
    release: v3.22.0
  justify:
    comment: >-
      Horizontal alignment of the filter controls. Requires `filter`, which is
      the only element this argument positions — the table itself always spans
      the full width of its container.
    release: v3.18.0
  wrap:
  wrap-cols:
    type: string
    optional: true
    comment: >-
      Comma-separated column count per rendered row when wrapping, summing to the
      table's column count. Splits a record across more than two rows on small
      devices, for example "2,4,1". Only the first group keeps one cell per
      column; later groups collapse into a single spanning cell. Requires `wrap`;
      an invalid list falls back to wrapping the last column only.
    release: v3.23.0
  wrapper:
    release: v2.0.0
  caption:
    comment: >-
      Caption rendered as the table's `<caption>` element, describing the
      table's contents. Supports inline Markdown.
    release: v3.12.0
  caption-top:
    type: bool
    default: false
    optional: true
    comment: >-
      Whether the caption renders above the table (Bootstrap `caption-top`).
      Requires `caption`.
    release: v3.12.0
  # deprecated arguments
  paging:
    type: bool
    optional: true
    comment: Whether paging is enabled for the table.
    release: v0.24.13
    deprecated: v1.23.0
    alternative: paginate
  pagingOptionPerPage:
    type: int
    optional: true
    comment: >-
      Sets the maximum number of rows to display on each page. Requires
      `paging = true`.
    release: v0.27.8
    deprecated: v1.23.0
    alternative: pagination
  pagingOptionPageSelect:
    type: string
    optional: true
    comment: >-
      Sets the per page options in the dropdown. Must be an array of integers or
      arrays in the format [label (string), value (int)]. Requires
      `paginate = true`.
    release: v0.27.8
    deprecated: v1.23.0
    alternative: pagination-select
example: |
  {{< table >}}
  | Column 1 | Column 2 | Column 3 |
  |----------|----------|----------|
  | Cell 1   | Cell 2   | Cell 3   |
  | Cell 4   | Cell 5   | Cell 6   |
  {{< /table >}}
body:
  type: string
  optional: false
  comment: Table input in markdown format.
