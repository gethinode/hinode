# pnpm reads this for repo-wide settings even without sub-packages.
# allowBuilds is the v11 gate for which deps may run install scripts. Keep tight.
allowBuilds:
  hugo-extended: true # downloads the platform-specific Hugo binary
  # add more only when a postinstall failure is investigated and trusted
minimumReleaseAgeExclude:
  - "@gethinode/*"

# Force-patch transitive deps flagged by `pnpm audit --prod --audit-level=high`.
# adm-zip: hugo-extended pins ^0.5.17; force >=0.6.1 to cover both the
#   crafted-ZIP allocation DoS (GHSA-xcpc-8h2w-3j85 / CVE-2026-39244) and
#   destination-symlink overwrite (GHSA-vwc7-r8mq-g2x9).
# tar: hugo-extended's tar 7.5.16 carries node-tar DoS advisories; force >=7.5.19.
# svgo: cssnano > postcss-svgo pulls svgo 4.0.1 (removeScripts high advisory);
#   force the patched >=4.0.2.
# brace-expansion: reached through several chains (rimraf > glob > minimatch,
#   npm-run-all > minimatch, netlify-plugin-hugo-cache-resources > glob >
#   minimatch), which pinned 1.1.13 and 5.0.7 — both carrying the
#   unbounded-expansion DoS (GHSA-mh99-v99m-4gvg). Bumped to >=5.0.12 for the
#   quadratic-time `{a},b}` rewrite DoS affecting >=4.0.0 <5.0.12. Overridden
#   unscoped: a per-major key left minimatch@3 on 5.0.7 anyway, so scoping
#   bought nothing and only obscured what was happening. The package exports a
#   single expand() function whose signature is unchanged across these majors,
#   and lint + build pass on the forced version.
# js-yaml: cosmiconfig allows the vulnerable 4.3.1. Keep its v4 override
#   separate from the existing v5 constraint to avoid crossing API boundaries.
# smol-toml: markdownlint-cli2 pins vulnerable 1.8.0; force patched >=1.9.0
#   (quadratic-time parseKey DoS).
# shell-quote: npm-run-all pins 1.10.0; force the patched >=1.11.0 (quote()
#   command injection via line terminator after a comment token). Only one line
#   is present, so no key scoping is needed.
# handlebars: semantic-release > conventional-changelog-writer pins 4.7.9;
#   force >=4.7.10 (JavaScript injection via own-property check bypass and AST
#   type confusion).
# katex: markdownlint > micromark-extension-math pins 0.16.47; force >=0.18.2
#   (prototype pollution bypassing trust restrictions).
# fast-uri: ajv resolves vulnerable 3.1.8; require the v3 security fixes in
#   3.1.9 for URI scheme spoofing, host confusion, and reference normalization.
# undici: keep separate v6/v7 overrides. Versions 6.29.1 and 7.30.1 fix
#   excessive-content-encoding and EventSource parser DoS; 7.30.1 also fixes
#   the Subresource Integrity algorithm-token bypass.
# braces: stacked-exhaustion DoS advisory has no patched release yet (latest
#   is the vulnerable 3.0.3); nothing to override until upstream ships a fix.
# These are transitive: the relevant direct dependencies do not currently
# resolve all of them, so there is no direct upgrade that clears the audit.
# Drop each override once the upstream range ships the patched version.
overrides:
  adm-zip: ">=0.6.1"
  brace-expansion: ">=5.0.12"
  fast-uri@3: "^3.1.9"
  handlebars: ">=4.7.10"
  js-yaml@4: "^4.3.2"
  js-yaml@5: ">=5.2.2"
  katex: ">=0.18.2"
  shell-quote: ">=1.11.0"
  smol-toml: ">=1.9.0"
  svgo: ">=4.0.2"
  tar: ">=7.5.19"
  undici@6: "^6.29.1"
  undici@7: "^7.30.1"
