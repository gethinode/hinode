baseURL = 'https://example.org/'
title = 'command tests'
disableKinds = ['taxonomy', 'term', 'RSS', 'sitemap', 'robotsTXT', '404', 'section']

# Chroma emits CSS classes rather than inline styles, as with the theme's own noClasses = false.
[markup.highlight]
  noClasses = false

# Custom mounts disable Hugo's implicit ones, so this site's own folders are restated. The
# shortcode and its stylesheet are mounted from their location in the theme, not copied;
# InitArgs and the argument definitions it validates against come from the vendored mod-utils
# (pnpm mod:vendor).
[[module.mounts]]
  source = 'content'
  target = 'content'
[[module.mounts]]
  source = 'layouts'
  target = 'layouts'
[[module.mounts]]
  source = '../../layouts/_shortcodes/command.html'
  target = 'layouts/_shortcodes/command.html'
[[module.mounts]]
  source = '../../assets/scss/components/_command.scss'
  target = 'assets/scss/command.scss'
[[module.mounts]]
  source = '../../data/structures/command.yml'
  target = 'data/structures/command.yml'
[[module.mounts]]
  source = '../../_vendor/github.com/gethinode/mod-utils/v6/layouts/_partials/utilities'
  target = 'layouts/_partials/utilities'
[[module.mounts]]
  source = '../../_vendor/github.com/gethinode/mod-utils/v6/data/structures'
  target = 'data/structures'
